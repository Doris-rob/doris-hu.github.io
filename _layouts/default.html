<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="{{ '/assets/css/miora.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Doris 首页">
        <span>DORIS</span>
        <small>Personal workbench</small>
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
        <span class="menu-toggle__label">菜单</span>
        <span class="menu-toggle__icon" aria-hidden="true"></span>
      </button>

      <nav class="site-nav" id="site-navigation" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" aria-current="page">首页</a>
        <a href="#library">内容</a>
        <a href="#now">最近更新</a>
        <a class="site-nav__github" href="https://github.com/Doris-rob" rel="noreferrer">
          GitHub
          <span aria-hidden="true">↗</span>
        </a>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      <p class="site-footer__headline">
        KEEP<br>
        <span>MAKING.</span>
      </p>
      <div class="site-footer__bottom">
        <p>学习 · 思考 · 作品 · 长期积累</p>
        <a href="https://github.com/Doris-rob" rel="noreferrer">在 GitHub 找到我 ↗</a>
        <p>© <span id="current-year">2026</span> Doris</p>
      </div>
    </footer>

    <script>
      (() => {
        const menuButton = document.querySelector(".menu-toggle");
        const navigation = document.querySelector(".site-nav");
        const year = document.querySelector("#current-year");

        if (year) year.textContent = new Date().getFullYear();

        if (menuButton && navigation) {
          menuButton.addEventListener("click", () => {
            const isOpen = menuButton.getAttribute("aria-expanded") === "true";
            menuButton.setAttribute("aria-expanded", String(!isOpen));
            navigation.classList.toggle("is-open", !isOpen);
          });

          navigation.addEventListener("click", (event) => {
            if (event.target.closest("a")) {
              menuButton.setAttribute("aria-expanded", "false");
              navigation.classList.remove("is-open");
            }
          });
        }

        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.14 });

          document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));
        } else {
          document.querySelectorAll(".reveal").forEach((element) => element.classList.add("is-visible"));
        }
      })();
    </script>
  </body>
</html>
